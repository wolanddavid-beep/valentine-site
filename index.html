<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            text-align: center;
            overflow: hidden;
            position: relative; /* Anchor for fixed buttons */
        }
        h1 {
            font-size: 2.5em;
            margin: 0 0 2em 0; /* Tighten margin to avoid push */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            flex-shrink: 0; /* Prevent h1 from compressing */
        }
        .button {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: fixed; /* Viewport-fixed for true centering, ignores flex */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            box-sizing: border-box;
            /* TEMP: Colored borders for position testing - REMOVE AFTER CONFIRM */
            border: 3px solid #000; /* Yes: black, No: will override */
        }
        .button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #ff1493;
            color: white;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 1;
            border-color: red !important; /* TEMP: Red border for Yes */
        }
        #noBtn {
            background-color: #ff69b4;
            color: white;
            top: 60% !important; /* Offset below center */
            left: 70% !important; /* Offset right */
            transform: translate(-50%, -50%) !important;
            z-index: 2;
            transition: left 0.3s ease, top 0.3s ease !important;
            max-width: 40%;
            min-width: 120px;
            border-color: blue !important; /* TEMP: Blue border for No */
        }
        /* Shake Animation (#2) - Uncomment lines in JS to enable */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-3px, 0) scale(1.05); }
            75% { transform: translate(3px, 0) scale(1.05); }
        }
        #noBtn.shake {
            animation: shake 0.4s ease-in-out;
        }
        /* Confetti fall */
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️</h1>
    
    <button id="yesBtn" class="button">Yes! 💕</button>
    <button id="noBtn" class="button">No</button>
    
    <script>
        // Quick load confirm
        alert('Page loaded! If you see this, JS is working.'); // TEMP: Remove after test

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        if (!yesBtn || !noBtn) {
            alert('Buttons not found!'); // TEMP: Debug
            throw new Error('Buttons missing');
        }

        // Teasing Taunts (#1)
        const taunts = [
            "No? Come on, try again! 😏",
            "I'm slippery today! 💨",
            "Not yet... 😜",
            "Catch me if you can! 🏃‍♂️",
            "Aw, don't be shy! ❤️"
        ];
        let tauntIndex = 0;

        // Inline Simple Confetti (#3)
        function simpleConfetti() {
            const colors = ['#ff69b4', '#ff1493', '#fff', '#ffb6c1'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.style.cssText = `
                    position: fixed; left: ${Math.random() * 100}vw; top: -10px;
                    width: 10px; height: 10px; background: ${colors[Math.floor(Math.random() * colors.length)]};
                    border-radius: 50%; pointer-events: none; z-index: 10;
                    animation: fall ${0.5 + Math.random()}s linear forwards;
                `;
                document.body.appendChild(conf);
                setTimeout(() => { if (conf) conf.remove(); }, 2000);
            }
        }

        // Get bounds
        function getBounds() {
            const btnWidth = noBtn.offsetWidth || 150;
            const btnHeight = noBtn.offsetHeight || 60;
            return {
                maxX: Math.max(0, window.innerWidth - btnWidth - 20),
                maxY: Math.max(0, window.innerHeight - btnHeight - 20)
            };
        }

        // Dodge function
        function dodge(e) {
            if (e.type === 'touchend') e.preventDefault();
            noBtn.innerHTML = taunts[tauntIndex % taunts.length];
            tauntIndex = (tauntIndex + 1) % taunts.length;

            // Optional Shake (#2)
            // noBtn.classList.add('shake');
            // setTimeout(() => noBtn.classList.remove('shake'), 400);

            const { maxX, maxY } = getBounds();
            const newX = Math.random() * Math.max(1, maxX);
            const newY = Math.random() * Math.max(1, maxY);
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        // Attach events
        noBtn.addEventListener('touchend', dodge, { passive: false });
        noBtn.addEventListener('click', dodge);

        // Yes function
        function triggerYes() {
            simpleConfetti();
            setTimeout(() => { window.location.href = 'success.html'; }, 800);
        }
        yesBtn.addEventListener('touchend', triggerYes, { passive: false });
        yesBtn.addEventListener('click', triggerYes);

        // Resize: Minimal adjustment only if needed
        window.addEventListener('resize', () => {
            const { maxX, maxY } = getBounds();
            let currentLeft = parseFloat(noBtn.style.left) || (window.innerWidth * 0.7);
            let currentTop = parseFloat(noBtn.style.top) || (window.innerHeight * 0.6);
            if (currentLeft > maxX || currentTop > maxY) {
                noBtn.style.left = Math.min(window.innerWidth * 0.7, maxX * 0.7) + 'px';
                noBtn.style.top = Math.min(window.innerHeight * 0.6, maxY * 0.6) + 'px';
            }
        });

        // Post-load confirm (no position changes)
        window.addEventListener('load', () => {
            console.log('Fully loaded. Yes pos:', yesBtn.getBoundingClientRect()); // TEMP: Check console
            console.log('No pos:', noBtn.getBoundingClientRect());
        });
    </script>
</body>
</html>
