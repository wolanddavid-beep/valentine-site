<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            text-align: center;
            overflow: hidden; /* Prevents dodging off-screen */
            touch-action: none; /* Improves touch precision on mobile */
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .button {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            user-select: none; /* Prevents text selection on mobile */
            -webkit-user-select: none; /* iOS Safari */
            -webkit-touch-callout: none; /* iOS no long-press menu */
        }
        .button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #ff1493;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        #noBtn {
            background-color: #ff69b4;
            color: white;
            position: absolute;
            top: 60%;
            left: 70%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: left 0.3s ease, top 0.3s ease;
            max-width: 40%;
            min-width: 120px;
        }
        /* Shake Animation for Dodge (#2) - Optimized for mobile */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-3px, 0) scale(1.05); } /* Softer for mobile */
            75% { transform: translate(3px, 0) scale(1.05); }
        }
        #noBtn.shake {
            animation: shake 0.4s ease-in-out; /* Shorter duration */
            will-change: transform; /* Optimize rendering */
        }
        /* Fallback confetti styles (if JS fails) */
        .confetti-fallback {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .confetti-fallback::before {
            content: '🎉💕🎊';
            position: absolute;
            font-size: 2em;
            animation: fall 1s linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️</h1>
    
    <button id="yesBtn" class="button">Yes! 💕</button>
    <button id="noBtn" class="button">No</button>

    <!-- Confetti Library (#3) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        let noTaps = 0; // For throttling
        const tapThrottle = 300; // ms between dodges
        let lastTap = 0;

        // Teasing Taunts (#1)
        const taunts = [
            "No? Come on, try again! 😏",
            "I'm slippery today! 💨",
            "Not yet... 😜",
            "Catch me if you can! 🏃‍♂️",
            "Aw, don't be shy! ❤️"
        ];
        let tauntIndex = 0;

        // Function to get screen bounds (updates on resize)
        function getBounds() {
            return {
                maxX: window.innerWidth - noBtn.offsetWidth - 20,
                maxY: window.innerHeight - noBtn.offsetHeight - 20
            };
        }

        // Dodge Mechanic (with #1 & #2) - Throttled for mobile
        function dodge(e) {
            e.preventDefault();
            e.stopPropagation();

            const now = Date.now();
            if (now - lastTap < tapThrottle) return; // Throttle rapid taps
            lastTap = now;
            noTaps++;

            // Update taunt text (#1)
            noBtn.innerHTML = taunts[tauntIndex % taunts.length];
            tauntIndex = (tauntIndex + 1) % taunts.length;

            // Shake animation (#2)
            noBtn.classList.add('shake');
            setTimeout(() => { 
                if (noBtn) noBtn.classList.remove('shake'); 
            }, 400);

            // Random dodge position (keep on screen)
            const { maxX, maxY } = getBounds();
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = 'translate(-50%, -50%)';
        }

        // Unified pointer events for mobile/desktop compatibility
        noBtn.addEventListener('pointerdown', dodge, { passive: false });

        // Yes Button with Confetti (#3)
        function triggerYes() {
            // Check if confetti loaded; fallback to CSS
            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 80, // Lighter for mobile perf
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff69b4', '#ff1493', '#fff', '#ffb6c1'],
                    disableForReducedMotion: true // Respects mobile settings
                });
                // Shorter delay on mobile
                const delay = /Mobi|Android/i.test(navigator.userAgent) ? 500 : 1000;
                setTimeout(() => { window.location.href = 'success.html'; }, delay);
            } else {
                // Fallback: Add CSS confetti overlay
                const fallback = document.createElement('div');
                fallback.className = 'confetti-fallback';
                fallback.style.background = 'transparent';
                document.body.appendChild(fallback);
                setTimeout(() => { 
                    if (fallback) fallback.remove();
                    window.location.href = 'success.html'; 
                }, 1000);
            }
        }

        yesBtn.addEventListener('click', triggerYes);
        yesBtn.addEventListener('pointerdown', triggerYes, { passive: false });

        // Handle screen resize (e.g., mobile rotation)
        window.addEventListener('resize', () => {
            // Re-center Yes if needed
            yesBtn.style.left = '50%';
            yesBtn.style.top = '50%';
            // Bound No button if it's off-screen
            const { maxX, maxY } = getBounds();
            const rect = noBtn.getBoundingClientRect();
            if (rect.right > window.innerWidth) noBtn.style.left = (maxX / 2) + 'px';
            if (rect.bottom > window.innerHeight) noBtn.style.top = (maxY / 2) + 'px';
        });

        // Initial bounds check
        window.addEventListener('load', () => {
            const { maxX, maxY } = getBounds();
            if (noBtn.offsetLeft > maxX || noBtn.offsetTop > maxY) {
                noBtn.style.left = (maxX * 0.7) + 'px';
                noBtn.style.top = (maxY * 0.6) + 'px';
            }
        });
    </script>
</body>
</html>
