<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .button {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: absolute;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation; /* Faster touch response */
            box-sizing: border-box; /* Ensures padding doesn't push out of bounds */
        }
        .button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #ff1493;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        #noBtn {
            background-color: #ff69b4;
            color: white;
            top: 60%; /* Initial offset below and right of center */
            left: 70%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: left 0.3s ease, top 0.3s ease;
            max-width: 40%;
            min-width: 120px;
        }
        /* Shake Animation (#2) - Uncomment lines in JS to enable */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-3px, 0) scale(1.05); }
            75% { transform: translate(3px, 0) scale(1.05); }
        }
        #noBtn.shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>

    <button id="noBtn" class="button">No</button>
