<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ff69b4;
            color: #fff;
            text-align: center;
            overflow: hidden; /* Prevents scrolling off-screen */
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 2em;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        #yesBtn {
            background-color: #ff1493;
            color: white;
            font-weight: bold;
        }
        #yesBtn:hover {
            transform: scale(1.05);
        }
        #noBtn {
            background-color: #fff;
            color: #ff69b4;
            font-weight: bold;
            position: relative; /* Allows JS positioning */
            /* No fixed position—JS handles dodging */
        }
        #noBtn:active {
            transform: scale(0.95); /* Subtle press feel, but JS dodges first */
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; margin-bottom: 1.5em; }
            button { padding: 12px 24px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? 💕</h1>
    <div class="buttons">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No 😔</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        let isDodging = false; // Prevents rapid-fire dodges

        // Function to dodge: Move to random safe position away from touch/mouse
        function dodge(event) {
            if (isDodging) return; // Throttle to avoid spam
            isDodging = true;
            setTimeout(() => { isDodging = false; }, 300); // Reset after 300ms

            // Get event position (touch or mouse)
            let clientX, clientY;
            if (event.type === 'touchstart') {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            // Get screen dimensions and button size
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const btnRect = noBtn.getBoundingClientRect();
            const btnW = btnRect.width || 120; // Fallback size
            const btnH = btnRect.height || 50;

            // Calculate safe random position: Away from touch (opposite quadrant bias)
            let newX, newY;
            const margin = 20; // Padding from edges
            const awayDistance = 100; // How far to dodge

            // Bias away from touch: If touch is left, go right, etc.
            if (clientX < screenW / 2) {
                newX = Math.random() * (screenW - btnW - margin * 2) + margin + awayDistance;
            } else {
                newX = Math.random() * (screenW - btnW - margin * 2) + margin - awayDistance;
                if (newX < margin) newX = margin; // Clamp left
            }

            if (clientY < screenH / 2) {
                newY = Math.random() * (screenH - btnH - margin * 2) + margin + awayDistance;
            } else {
                newY = Math.random() * (screenH - btnH - margin * 2) + margin - awayDistance;
                if (newY < margin) newY = margin; // Clamp top
            }

            // Ensure always on-screen
            newX = Math.max(margin, Math.min(newX, screenW - btnW - margin));
            newY = Math.max(margin, Math.min(newY, screenH - btnH - margin));

            // Animate to new position (smooth dodge)
            noBtn.style.transition = 'all 0.3s ease';
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = 'translate(0, 0)'; // Reset any prior scale

            // Optional: Shake or scale for fun
            noBtn.style.transform += ' scale(1.1)';
            setTimeout(() => {
                noBtn.style.transform = 'translate(0, 0) scale(1)';
            }, 150);
        }

        // Event listeners: Touch for mobile, mouse for desktop
        noBtn.addEventListener('touchstart', dodge, { passive: false });
        noBtn.addEventListener('mousedown', dodge);

        // Prevent actual click if dodged (but allow after a beat if user persists)
        noBtn.addEventListener('click', (e) => {
            // Optional: If you want No to eventually work (e.g., lead to a "Are you sure?" page)
            // For now, it just dodges endlessly—comment out if needed
            e.preventDefault();
            dodge(e);
        });

        // Yes button: Redirect to success
        yesBtn.addEventListener('click', () => {
            window.location.href = 'success.html';
        });

        // Initial position: Center if needed
        window.addEventListener('load', () => {
            noBtn.style.position = 'relative';
        });

        // Handle resize/orientation change on mobile
        window.addEventListener('resize', () => {
            // Reset to center on resize to avoid stuck positions
            noBtn.style.position = 'relative';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
        });
    </script>
</body>
</html>
