<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff;
            text-align: center;
            overflow: hidden; /* Prevents dodging off-screen */
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .button {
            padding: 15px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            user-select: none; /* Prevents text selection on mobile */
        }
        .button:active {
            transform: scale(0.95);
        }
        #yesBtn {
            background-color: #ff1493;
            color: white;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        #noBtn {
            background-color: #ff69b4;
            color: white;
            position: absolute;
            top: 60%;
            left: 70%;
            transform: translate(-50%, -50%);
            z-index: 2;
            transition: left 0.3s ease, top 0.3s ease;
        }
        /* Shake Animation for Dodge (#2) */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-5px, 0) scale(1.1); }
            75% { transform: translate(5px, 0) scale(1.1); }
        }
        #noBtn.shake {
            animation: shake 0.5s ease-in-out;
        }
        /* Ensure buttons stay in bounds */
        #noBtn {
            max-width: 40%;
            min-width: 120px;
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️</h1>
    
    <button id="yesBtn" class="button">Yes! 💕</button>
    <button id="noBtn" class="button">No</button>

    <!-- Confetti Library (#3) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');

        // Teasing Taunts (#1)
        const taunts = [
            "No? Come on, try again! 😏",
            "I'm slippery today! 💨",
            "Not yet... 😜",
            "Catch me if you can! 🏃‍♂️",
            "Aw, don't be shy! ❤️"
        ];
        let tauntIndex = 0;

        // Dodge Mechanic (with #1 & #2)
        function dodge(e) {
            e.preventDefault(); // Prevent redirect on mobile taps
            e.stopPropagation();

            // Update taunt text (#1)
            noBtn.innerHTML = taunts[tauntIndex % taunts.length];
            tauntIndex++;

            // Shake animation (#2)
            noBtn.classList.add('shake');
            setTimeout(() => { noBtn.classList.remove('shake'); }, 500);

            // Random dodge position (keep on screen)
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = 'translate(-50%, -50%)';
        }

        // Event listeners for No button (touch + mouse for compatibility)
        noBtn.addEventListener('click', dodge);
        noBtn.addEventListener('touchstart', dodge, { passive: false });
        noBtn.addEventListener('mousedown', dodge);

        // Yes Button with Confetti (#3)
        yesBtn.addEventListener('click', () => {
            // Pink/red confetti burst
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff69b4', '#ff1493', '#fff', '#ffb6c1']
            });
            // Delay redirect for the show
            setTimeout(() => { window.location.href = 'success.html'; }, 1000);
        });

        // Mobile touch for Yes (in case)
        yesBtn.addEventListener('touchstart', () => {
            yesBtn.click(); // Trigger the same action
        });
    </script>
</body>
</html>
